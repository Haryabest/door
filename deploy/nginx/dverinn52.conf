# Актуальный конфиг для dverinn52.ru (SPA + API + uploads).
# Скопировать в /etc/nginx/sites-available/default и: nginx -t && systemctl reload nginx

server {
    server_name dverinn52.ru www.dverinn52.ru;

    root /var/www/door/dist;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https: http: blob:; connect-src 'self' https:; frame-ancestors 'none';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dverinn52.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dverinn52.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.dverinn52.ru) {
        return 301 https://$host$request_uri;
    }

    if ($host = dverinn52.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name dverinn52.ru www.dverinn52.ru;
    return 404;
}
