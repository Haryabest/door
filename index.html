<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/logo.ico" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>От А до Я — Двери и фурнитура в Нижнем Новгороде</title>
    <meta
      name="description"
      content="Межкомнатные и входные двери, фурнитура. Консультация, замер, доставка и установка в Нижнем Новгороде."
    />
    <link rel="preload" href="/hero-lcp.avif" as="image" type="image/avif" fetchpriority="high" />
  </head>
  <body>
    <div id="static-hero-lcp" style="position:fixed;left:0;right:0;top:5rem;bottom:0;z-index:0;pointer-events:none;overflow:hidden;background:#0f3c65">
      <img
        src="/hero-lcp.avif"
        alt=""
        width="1920"
        height="1080"
        fetchpriority="high"
        decoding="sync"
        style="width:100%;height:100%;object-fit:cover"
      />
      <div style="position:absolute;inset:0;background:rgba(0,0,0,.5)"></div>
      <div data-static-hero-copy style="position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;color:#fff;font-family:system-ui,sans-serif">
        <div>
          <h1 style="margin:0 0 12px;font-size:clamp(2rem,10vw,4.5rem);font-weight:700;line-height:1.1">От А до Я</h1>
          <p style="margin:0 0 8px;font-size:clamp(1rem,4vw,1.75rem);opacity:.92">Премиум двери и фурнитура</p>
          <p style="margin:0;font-size:clamp(.9rem,3vw,1.25rem);opacity:.8">Нижний Новгород</p>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var path = location.pathname;
        if (path === '/' || path === '') {
          var p = document.getElementById('boot-placeholder');
          if (p) p.style.visibility = 'hidden';
        }
      })();
    </script>
    <div id="root">
      <div
        id="boot-placeholder"
        style="
          display: flex;
          min-height: 100vh;
          align-items: center;
          justify-content: center;
          font-family: system-ui, sans-serif;
          color: #0f3c65;
        "
      >
        Загрузка…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var BOOT_MS = 10000;
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (!root) return;
          var placeholder = document.getElementById('boot-placeholder');
          if (placeholder && root.contains(placeholder)) {
            root.innerHTML =
              '<div style="display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;text-align:center;color:#0f3c65">' +
              '<div><p style="font-size:20px;font-weight:700;margin:0 0 12px">Страница не загрузилась</p>' +
              '<p style="margin:0 0 12px;color:#64748b;max-width:400px;font-size:14px">Расширения вроде <strong>AdBlock</strong>, блокировщиков рекламы и переводчиков могут мешать работе сайта. Отключите их для этого домена или откройте сайт в режиме инкогнито без расширений.</p>' +
              '<button type="button" onclick="location.reload()" style="padding:12px 24px;border:none;border-radius:8px;background:#0f3c65;color:#fff;font-weight:600;cursor:pointer">Обновить</button></div></div>';
          }
        }, BOOT_MS);
      })();
    </script>
  </body>
</html>
